<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Cinema</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div id="landing-page"> 
    <h1>Mini Cinema</h1>
    <p>Same movie. Same moment. Anywhere.</p>
    <button id="create-room-btn">Create Room</button>
    <input id="join-room-input" type="text" placeholder="Enter room code">
     <button id="join-room-btn">Join Room</button>
      
     </div>

     <div id="room-page">
    <div class="room-header">
        <div>
            <p class="room-label">Room</p>
            <h2>Room Code: <span id="room-code-display"></span></h2>
        </div>
        <button id="leave-room-btn" class="secondary-btn">Leave Room</button>
    </div>

    <div class="room-body">
        <section class="movie-panel">
            <div id="member-wrap">
                <h3>Members</h3>
                <ul id="member-list"></ul>
            </div>

            <div class="video-stage">
                <div id="player" aria-live="polite">
                    <div id="player-empty-state" class="player-empty-state">
                        <div class="player-empty-icon">▶</div>
                        <h3>Waiting for the host to pick a movie</h3>
                        <p>Paste a YouTube URL and click “Set Video” to begin the room.</p>
                    </div>
                </div>
                <div id="reaction-overlay" aria-live="polite"></div>

                <div id="sync-toast" class="sync-toast" role="alert" aria-live="assertive">
                    <span class="sync-toast-icon">⚠️</span>
                    <span class="sync-toast-text">You're out of sync with the host</span>
                    <button id="sync-toast-sync-btn" class="sync-toast-sync" type="button">Sync now</button>
                    <button id="sync-toast-dismiss" class="sync-toast-close" type="button" aria-label="Dismiss">×</button>
                </div>

                <button id="fullscreen-toggle-btn" class="fullscreen-toggle" type="button" aria-label="Toggle fullscreen" aria-pressed="false">⛶</button>
            </div>

        

            <div class="video-controls">
                <input id="youtube-url-input" type="text" placeholder="Paste YouTube URL">
                <button id="set-video-btn">Set Video</button>
                <button id="resync-btn" style="display: none;">Resync</button>
                <button id="guest-controls-btn" class="mode-switch" type="button" aria-pressed="true">
                    <span class="mode-switch-thumb"></span>
                    <span class="mode-switch-label mode-switch-label-host">Host controls</span>
                    <span class="mode-switch-label mode-switch-label-self">I control</span>
                </button>
            </div>
        </section>

        <aside id="chat-sidebar">
            <h2>Chat</h2>
            <div id="chat-messages-wrap">
                <div id="chat-messages"></div>
                <button id="new-message-badge" class="new-message-badge" type="button">
                    <span aria-hidden="true">↓</span> New messages
                </button>
            </div>

            <div id="chat-input-area">
                <input
                    type="text"
                    id="chat-input"
                    placeholder="Type a message..."
                >

                <button id="send-chat-btn">Send</button>
            </div>
        </aside>
    </div>
</div>
<script>
    let youtubeAPIReady = false;
    window.onYouTubeIframeAPIReady = function() {
        youtubeAPIReady = true;
        if (window.initializePlayer) {
            window.initializePlayer();
        }
    };
</script>
<script src="https://www.youtube.com/iframe_api"></script>
<script type="module" src="./js/app.js"></script>
<footer>  <p>Having issues? Reach out at <a href="mailto:nicolemumo3@gmail.com">nicolemumo3@gmail.com</a></p></footer>
</body>
  
</html>
